<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' blob:; worker-src blob:; connect-src 'none'; img-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; object-src 'none';"
    />
    <title>Autopilot Sandbox</title>
  </head>
  <body>
    <script>
      (() => {
        'use strict';

        let currentCode = '';
        let currentVersion = 0;
        let worker = null;
        let workerLoaded = false;
        const pending = new Map();
        // Runs reach the worker one at a time so each frame budget only counts that run's own time,
        // even when the host pipelines several steps ahead.
        const queue = [];

        const send = (message) => parent.postMessage(message, '*');

        const isRecord = (value) => typeof value === 'object' && value !== null;
        const isLoadMessage = (value) =>
          isRecord(value) && value.type === 'load-code' && typeof value.version === 'number' && typeof value.js === 'string';
        const isRunMessage = (value) =>
          isRecord(value) &&
          value.type === 'run-autopilot' &&
          typeof value.id === 'number' &&
          typeof value.timeoutMs === 'number' &&
          isRecord(value.input);

        const terminateWorker = () => {
          if (worker) worker.terminate();
          worker = null;
          workerLoaded = false;
          for (const [id, record] of pending) {
            clearTimeout(record.timer);
            send({ type: 'run-error', id, message: 'Autopilot code was restarted.' });
          }
          pending.clear();
        };

        const failQueued = () => {
          for (const message of queue.splice(0)) send({ type: 'run-error', id: message.id, message: 'Autopilot code was restarted.' });
        };

        const pump = () => {
          if (!worker || !workerLoaded || pending.size > 0 || queue.length === 0) return;
          const message = queue.shift();
          const timer = setTimeout(() => {
            pending.delete(message.id);
            terminateWorker();
            if (currentCode) createWorker(currentCode, currentVersion);
            send({ type: 'run-error', id: message.id, message: 'Autopilot exceeded the frame budget and was restarted.' });
          }, Math.max(4, Math.min(100, message.timeoutMs)));

          pending.set(message.id, { timer });
          worker.postMessage({ type: 'run-autopilot', id: message.id, input: message.input, inspect: message.inspect !== false });
        };

        const createWorker = (code, version) => {
          terminateWorker();
          currentCode = code;
          currentVersion = version;

          const workerSource = `
            'use strict';
            const __sandboxSend = self.postMessage.bind(self);
            const __inspectionVersion = ${version};
            const __inspectionBindings = new Map();
            const __inspectionCalls = new Map();
            let __lastInspectionSnapshotAt = 0;
            // graph(name, value, unit?) records one value per autopilot call for the telemetry graphs.
            // It lives outside the user-code scope so drivers may still declare their own "graph".
            const __GRAPH_LIMIT = 48;
            let __graphValues = {};
            let __graphCount = 0;
            const graph = (name, value, unit) => {
              const numeric = typeof value === 'boolean' ? Number(value) : value;
              if (typeof numeric !== 'number' || !Number.isFinite(numeric)) return value;
              const key = String(name).slice(0, 60);
              if (!key) return value;
              if (!Object.prototype.hasOwnProperty.call(__graphValues, key)) {
                if (__graphCount >= __GRAPH_LIMIT) return value;
                __graphCount += 1;
              }
              __graphValues[key] = { value: numeric, unit: unit === undefined ? undefined : String(unit).slice(0, 24) };
              return value;
            };
            const __playgroundTraceValue = (id, value) => {
              __inspectionBindings.set(id, { value, observedAt: Date.now() });
              return value;
            };
            const __playgroundTracePostfix = (id, readCurrent, expressionResult) => {
              let current;
              try { current = readCurrent(); } catch (_) { current = expressionResult; }
              __inspectionBindings.set(id, { value: current, observedAt: Date.now() });
              return expressionResult;
            };
            const __playgroundTraceToolboxCall = (id, name, fn, args) => {
              const result = Reflect.apply(fn, undefined, args);
              const record = { name, args, result, observedAt: Date.now() };
              if (name === 'createPidController' && result && typeof result.getDebug === 'function') {
                try { record.pidDebug = result.getDebug.bind(result); } catch (_) {}
              }
              __inspectionCalls.set(id, record);
              return result;
            };
            const __inspectionPreview = (value, state, path, depth) => {
              try {
                if (value === undefined) return { type: 'undefined' };
                if (value === null) return { type: 'null' };
                if (typeof value === 'boolean') return { type: 'boolean', value };
                if (typeof value === 'number') {
                  const display = Number.isNaN(value)
                    ? 'NaN'
                    : value === Infinity
                    ? 'Infinity'
                    : value === -Infinity
                    ? '-Infinity'
                    : Object.is(value, -0)
                    ? '-0'
                    : value;
                  return { type: 'number', value: display };
                }
                if (typeof value === 'bigint') return { type: 'bigint', value: String(value) };
                if (typeof value === 'string') {
                  return value.length > 240
                    ? { type: 'string', value: value.slice(0, 240), truncated: true }
                    : { type: 'string', value };
                }
                if (typeof value === 'function') return { type: 'function', name: value.name || undefined };
                if (typeof value === 'symbol') return { type: 'symbol', value: String(value) };
                if (depth >= 4) return { type: 'unavailable', reason: 'Maximum preview depth reached' };
                if (state.seen.has(value)) return { type: 'reference', path: state.seen.get(value) };
                if (state.nodes >= 120) return { type: 'unavailable', reason: 'Preview size limit reached' };
                state.seen.set(value, path);
                state.nodes += 1;

                if (Array.isArray(value)) {
                  const limit = Math.min(value.length, 8);
                  const items = [];
                  for (let index = 0; index < limit; index += 1) {
                    const descriptor = Object.getOwnPropertyDescriptor(value, String(index));
                    items.push(
                      descriptor && 'value' in descriptor
                        ? __inspectionPreview(descriptor.value, state, path + '[' + index + ']', depth + 1)
                        : { type: 'unavailable', reason: 'Accessor or empty slot' }
                    );
                  }
                  return { type: 'array', items, length: value.length, truncated: value.length > limit || undefined };
                }

                const descriptors = Object.getOwnPropertyDescriptors(value);
                const keys = Object.keys(descriptors).slice(0, 12);
                const properties = {};
                for (const key of keys) {
                  const descriptor = descriptors[key];
                  properties[key] = descriptor && 'value' in descriptor
                    ? __inspectionPreview(descriptor.value, state, path + '.' + key, depth + 1)
                    : { type: 'unavailable', reason: 'Accessor not evaluated' };
                }
                let name;
                const constructorDescriptor = descriptors.constructor;
                if (constructorDescriptor && 'value' in constructorDescriptor && typeof constructorDescriptor.value === 'function') {
                  name = constructorDescriptor.value.name || undefined;
                }
                return {
                  type: 'object',
                  name,
                  properties,
                  truncated: Object.keys(descriptors).length > keys.length || undefined
                };
              } catch (_) {
                return { type: 'unavailable', reason: 'Value could not be inspected safely' };
              }
            };
            const __previewRoot = (value, path) => __inspectionPreview(value, { seen: new WeakMap(), nodes: 0 }, path, 0);
            const __toolboxDetails = (record) => {
              try {
                const args = record.args;
                const result = record.result;
                switch (record.name) {
                  case 'createPidController': {
                    let debug;
                    try { debug = record.pidDebug ? record.pidDebug() : undefined; } catch (_) {}
                    if (debug) record.observedAt = Date.now();
                    const options = args[0] || {};
                    const unclamped = debug
                      ? Number(debug.proportional || 0) + Number(debug.integral || 0) + Number(debug.derivative || 0)
                      : undefined;
                    return { options, debug, unclamped };
                  }
                  case 'analyzeLane':
                    return {
                      centerOffset: result && result.centerOffset,
                      heading: result && result.heading,
                      curvature: result && result.curvature,
                      confidence: result && result.confidence,
                      relativeTargetLane: args[1] !== undefined ? args[1] : 0
                    };
                  case 'closestVehicleAhead':
                    return { relativeLane: args[2] === undefined ? 0 : args[2], vehicle: result };
                  case 'adaptiveCruiseTargetSpeed': {
                    const input = args[0] || {};
                    const freeRoadSpeed = args[1];
                    const ego = input.ego || {};
                    const vehicles = Array.isArray(input.vehicles) ? input.vehicles : [];
                    const laneLines = input.laneLines || {};
                    // Approximates the toolbox's isVehicleInLane: any part of the box between ego's lane lines.
                    const lineX = (samples, y, fallback) => {
                      if (!Array.isArray(samples) || samples.length === 0) return fallback;
                      let nearest = samples[0];
                      for (const sample of samples) if (Math.abs(sample.y - y) < Math.abs(nearest.y - y)) nearest = sample;
                      return Number(nearest.x);
                    };
                    let lead;
                    for (const vehicle of vehicles) {
                      if (!vehicle || !(vehicle.relativeY > 0)) continue;
                      const left = lineX(laneLines.left, vehicle.relativeY, -1.85);
                      const right = lineX(laneLines.right, vehicle.relativeY, 1.85);
                      const yaw = Number(vehicle.relativeHeading || 0);
                      const halfExtent = (Math.abs(Math.cos(yaw)) * vehicle.width + Math.abs(Math.sin(yaw)) * vehicle.length) / 2;
                      if (vehicle.relativeX + halfExtent <= left || vehicle.relativeX - halfExtent >= right) continue;
                      if (!lead || vehicle.relativeY < lead.relativeY) lead = vehicle;
                    }
                    return {
                      freeRoadSpeed,
                      targetSpeed: result,
                      targetGap: 10 + Number(ego.speed || 0) * 1.25,
                      lead,
                      mode: Number(result) < Number(freeRoadSpeed) ? 'following' : 'free road'
                    };
                  }
                  case 'speedFeedforward':
                    return { targetSpeed: args[0], output: result };
                  case 'steeringFeedforward':
                    return { curvature: args[0], speed: args[1], output: result };
                  case 'lateralVelocitySteering': {
                    const ego = (args[0] && args[0].ego) || {};
                    return { targetLateralVelocity: args[1], lateralVelocity: ego.lateralVelocity, output: result };
                  }
                  case 'clamp':
                    return {
                      input: args[0], min: args[1], max: args[2], output: result,
                      saturation: Number(args[0]) < Number(args[1]) ? 'low' : Number(args[0]) > Number(args[2]) ? 'high' : 'none'
                    };
                  default:
                    return undefined;
                }
              } catch (_) {
                return undefined;
              }
            };
            const __inspectionSnapshot = () => {
              const now = Date.now();
              if (now - __lastInspectionSnapshotAt < 100) return undefined;
              __lastInspectionSnapshotAt = now;
              const bindings = {};
              for (const [id, record] of __inspectionBindings) {
                bindings[id] = { observedAt: record.observedAt, value: __previewRoot(record.value, id) };
              }
              const toolboxCalls = {};
              for (const [id, record] of __inspectionCalls) {
                const rawDetails = __toolboxDetails(record);
                const details = {};
                if (rawDetails) {
                  for (const [key, value] of Object.entries(rawDetails)) details[key] = __previewRoot(value, id + '.details.' + key);
                }
                toolboxCalls[id] = {
                  id,
                  name: record.name,
                  observedAt: record.observedAt,
                  args: [],
                  result: { type: 'unavailable', reason: 'Use the formatted toolbox details' },
                  details
                };
              }
              return { version: __inspectionVersion, capturedAt: now, bindings, toolboxCalls };
            };
            const __blocked = () => { throw new Error('Network, storage, and import APIs are disabled for autopilot code.'); };
            const __defineBlocked = (name, value) => {
              try { Object.defineProperty(self, name, { value, writable: false, configurable: false }); } catch (_) { try { self[name] = value; } catch (_) {} }
            };
            __defineBlocked('fetch', __blocked);
            __defineBlocked('XMLHttpRequest', undefined);
            __defineBlocked('WebSocket', undefined);
            __defineBlocked('EventSource', undefined);
            __defineBlocked('importScripts', __blocked);
            __defineBlocked('localStorage', undefined);
            __defineBlocked('sessionStorage', undefined);
            __defineBlocked('indexedDB', undefined);
            __defineBlocked('caches', undefined);
            let __autopilot = null;
            try {
              __autopilot = (() => {
                const exports = {};
                const module = { exports };
                const require = __blocked;
                const fetch = __blocked;
                const XMLHttpRequest = undefined;
                const WebSocket = undefined;
                const EventSource = undefined;
                const importScripts = __blocked;
                const localStorage = undefined;
                const sessionStorage = undefined;
                const indexedDB = undefined;
                const caches = undefined;
                const postMessage = undefined;
                /* runner-helpers:start (also used by server-side validation; see src/sandbox/runnerSource.ts) */
                const __clamp = (value, min, max) => Math.max(min, Math.min(max, Number.isFinite(value) ? value : 0));
                const __sampleLineAtY = (samples, y) => {
                  if (!Array.isArray(samples) || samples.length === 0) return undefined;
                  const sorted = [...samples].sort((a, b) => Number(a.y || 0) - Number(b.y || 0));
                  let before = sorted[0];
                  let after = sorted[sorted.length - 1];
                  for (const sample of sorted) {
                    if (Number(sample.y || 0) <= y) before = sample;
                    if (Number(sample.y || 0) >= y) {
                      after = sample;
                      break;
                    }
                  }
                  if (before === after) return before;
                  const beforeY = Number(before.y || 0);
                  const afterY = Number(after.y || 0);
                  const t = (y - beforeY) / Math.max(0.001, afterY - beforeY);
                  return {
                    x: Number(before.x || 0) + (Number(after.x || 0) - Number(before.x || 0)) * t,
                    y,
                    confidence: Number(before.confidence || 0) + (Number(after.confidence || 0) - Number(before.confidence || 0)) * t
                  };
                };
                const __lineCenterAtY = (leftSamples, rightSamples, y) => {
                  const left = __sampleLineAtY(leftSamples, y);
                  const right = __sampleLineAtY(rightSamples, y);
                  if (left && right) return { x: (left.x + right.x) / 2, y, confidence: (left.confidence + right.confidence) / 2 };
                  if (left) return { x: left.x + 1.85, y, confidence: left.confidence * 0.5 };
                  if (right) return { x: right.x - 1.85, y, confidence: right.confidence * 0.5 };
                  return { x: 0, y, confidence: 0 };
                };
                const __solve3x3 = (matrix) => {
                  const rows = matrix.map((row) => [...row]);
                  for (let pivot = 0; pivot < 3; pivot += 1) {
                    let bestRow = pivot;
                    for (let row = pivot + 1; row < 3; row += 1) {
                      if (Math.abs(rows[row][pivot]) > Math.abs(rows[bestRow][pivot])) bestRow = row;
                    }
                    if (Math.abs(rows[bestRow][pivot]) < 1e-9) return undefined;
                    [rows[pivot], rows[bestRow]] = [rows[bestRow], rows[pivot]];
                    const divisor = rows[pivot][pivot];
                    for (let col = pivot; col < 4; col += 1) rows[pivot][col] /= divisor;
                    for (let row = 0; row < 3; row += 1) {
                      if (row === pivot) continue;
                      const factor = rows[row][pivot];
                      for (let col = pivot; col < 4; col += 1) rows[row][col] -= factor * rows[pivot][col];
                    }
                  }
                  return [rows[0][3], rows[1][3], rows[2][3]];
                };
                const __fitForwardLaneCenterline = (leftSamples, rightSamples, local) => {
                  const samples = [];
                  for (let y = local ? 3 : 5; y <= (local ? 15.5 : 56); y += local ? 2.4 : y < 25 ? 4 : 6) {
                    const center = __lineCenterAtY(leftSamples, rightSamples, y);
                    if (center.confidence > 0.08) samples.push(center);
                  }
                  if (samples.length < 5) return undefined;
                  let s0 = 0, s1 = 0, s2 = 0, s3 = 0, s4 = 0, t0 = 0, t1 = 0, t2 = 0, weightTotal = 0;
                  for (const sample of samples) {
                    const y = sample.y;
                    const y2 = y * y;
                    const distanceT = __clamp((y - 5) / 51, 0, 1);
                    const confidenceWeight = __clamp(sample.confidence, 0.08, 1) * (1 - distanceT * 0.62);
                    const weight = local
                      ? __clamp(sample.confidence, 0.08, 1) * (1 - __clamp((y - 3) / 12, 0, 1) * 0.7)
                      : confidenceWeight;
                    s0 += weight;
                    s1 += weight * y;
                    s2 += weight * y2;
                    s3 += weight * y2 * y;
                    s4 += weight * y2 * y2;
                    t0 += weight * sample.x;
                    t1 += weight * sample.x * y;
                    t2 += weight * sample.x * y2;
                    weightTotal += confidenceWeight;
                  }
                  const solution = __solve3x3([[s0, s1, s2, t0], [s1, s2, s3, t1], [s2, s3, s4, t2]]);
                  if (!solution) return undefined;
                  return { c0: solution[0], c1: solution[1], c2: solution[2], confidence: __clamp(weightTotal / samples.length, 0, 1) };
                };
                const __quadraticCurvatureFromThreePoints = (near, mid, far) => {
                  const nearToMid = Math.max(1, mid.y - near.y);
                  const midToFar = Math.max(1, far.y - mid.y);
                  const slopeNear = (mid.x - near.x) / nearToMid;
                  const slopeFar = (far.x - mid.x) / midToFar;
                  return (slopeFar - slopeNear) / Math.max(1, (nearToMid + midToFar) / 2);
                };
                const __averageConfidence = (samples) => {
                  if (!Array.isArray(samples) || samples.length === 0) return 0;
                  return samples.reduce((total, sample) => total + Number(sample.confidence || 0), 0) / samples.length;
                };
                const __analyzeLaneBoundaries = (leftSamples, rightSamples, local) => {
                  const fallbackConfidence = __averageConfidence([...(leftSamples || []), ...(rightSamples || [])]);
                  if ((!Array.isArray(leftSamples) || leftSamples.length === 0) && (!Array.isArray(rightSamples) || rightSamples.length === 0)) {
                    return { centerOffset: 0, heading: 0, curvature: 0, confidence: 0 };
                  }
                  const centerNear = __lineCenterAtY(leftSamples, rightSamples, 5);
                  const centerMid = __lineCenterAtY(leftSamples, rightSamples, 30);
                  const centerFar = __lineCenterAtY(leftSamples, rightSamples, 62);
                  const fit = __fitForwardLaneCenterline(leftSamples, rightSamples, local);
                  const fallbackHeading = Math.atan2(centerFar.x - centerNear.x, Math.max(1, centerFar.y - centerNear.y));
                  const headingLookahead = local ? 0 : 18;
                  const curvatureLookahead = local ? 0 : 12;
                  const headingSlope = fit ? fit.c1 + 2 * fit.c2 * headingLookahead : Math.tan(fallbackHeading);
                  const curvatureSlope = fit ? fit.c1 + 2 * fit.c2 * curvatureLookahead : headingSlope;
                  return {
                    centerOffset: local && fit ? fit.c0 : centerNear.x,
                    heading: Math.atan(headingSlope),
                    curvature: fit
                      ? (2 * fit.c2) / Math.max(0.2, Math.pow(1 + curvatureSlope * curvatureSlope, 1.5))
                      : __quadraticCurvatureFromThreePoints(centerNear, centerMid, centerFar),
                    confidence: fit ? fit.confidence : __clamp((centerNear.confidence + centerMid.confidence + centerFar.confidence) / 3 || fallbackConfidence, 0, 1)
                  };
                };
                function analyzeLane(laneLines, relativeTargetLane = 0, mode = 'local') {
                  if (!laneLines || typeof laneLines !== 'object') return { centerOffset: 0, heading: 0, curvature: 0, confidence: 0 };
                  if (relativeTargetLane < 0) return __analyzeLaneBoundaries(laneLines.farLeft, laneLines.left, mode !== 'preview');
                  if (relativeTargetLane > 0) return __analyzeLaneBoundaries(laneLines.right, laneLines.farRight, mode !== 'preview');
                  return __analyzeLaneBoundaries(laneLines.left, laneLines.right, mode !== 'preview');
                }
                /* runner-helpers:end */
                ${code}
                return module.exports.autopilot || exports.autopilot || (typeof autopilot === 'function' ? autopilot : undefined);
              })();
              if (typeof __autopilot !== 'function') {
                throw new Error('User code must export or define function autopilot(input).');
              }
              __sandboxSend({ type: 'worker-loaded' });
            } catch (error) {
              __sandboxSend({
                type: 'worker-load-error',
                message: error && error.message ? String(error.message) : String(error),
                stack: error && error.stack ? String(error.stack) : undefined
              });
            }

            self.onmessage = (event) => {
              const message = event.data;
              if (!message || message.type !== 'run-autopilot' || typeof message.id !== 'number') return;
              if (typeof __autopilot !== 'function') {
                __sandboxSend({ type: 'worker-error', id: message.id, message: 'Autopilot function is not loaded.' });
                return;
              }
              const started = performance.now();
              __graphValues = {};
              __graphCount = 0;
              try {
                const output = __autopilot(message.input);
                __sandboxSend({
                  type: 'worker-result',
                  id: message.id,
                  output,
                  graphs: __graphCount ? __graphValues : undefined,
                  durationMs: performance.now() - started,
                  inspection: message.inspect === false ? undefined : __inspectionSnapshot()
                });
              } catch (error) {
                __sandboxSend({
                  type: 'worker-error',
                  id: message.id,
                  message: error && error.message ? String(error.message) : String(error),
                  stack: error && error.stack ? String(error.stack) : undefined
                });
              }
            };
          `;

          const blob = new Blob([workerSource], { type: 'text/javascript' });
          const url = URL.createObjectURL(blob);
          worker = new Worker(url);
          URL.revokeObjectURL(url);

          worker.onmessage = (event) => {
            const message = event.data;
            if (!isRecord(message) || typeof message.type !== 'string') return;
            if (message.type === 'worker-loaded') {
              workerLoaded = true;
              send({ type: 'code-loaded', version });
              pump();
              return;
            }
            if (message.type === 'worker-load-error') {
              send({ type: 'code-load-error', version, message: String(message.message || 'Unable to load user code.') });
              // The worker still answers runs, with "not loaded" errors, so queued runs do not hang.
              workerLoaded = true;
              pump();
              return;
            }
            if (message.type === 'worker-result') {
              const record = pending.get(message.id);
              if (record) {
                clearTimeout(record.timer);
                pending.delete(message.id);
              }
              send({
                type: 'run-result',
                id: message.id,
                output: message.output,
                durationMs: Number(message.durationMs || 0),
                inspection: message.inspection,
                graphs: message.graphs
              });
              pump();
              return;
            }
            if (message.type === 'worker-error') {
              const record = pending.get(message.id);
              if (record) {
                clearTimeout(record.timer);
                pending.delete(message.id);
              }
              send({ type: 'run-error', id: message.id, message: String(message.message || 'Runtime error.'), stack: message.stack });
              pump();
            }
          };

          worker.onerror = (event) => {
            send({ type: 'code-load-error', version, message: event.message || 'Worker script failed.' });
          };
        };

        window.addEventListener('message', (event) => {
          const message = event.data;
          if (isLoadMessage(message)) {
            failQueued();
            createWorker(message.js, message.version);
            return;
          }

          if (isRunMessage(message)) {
            if (!worker) {
              send({ type: 'run-error', id: message.id, message: 'Autopilot code is not loaded.' });
              return;
            }

            queue.push(message);
            pump();
          }
        });

        send({ type: 'sandbox-ready' });
      })();
    </script>
  </body>
</html>
